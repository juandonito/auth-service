name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpass
          POSTGRES_DB: authdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authuser -d authdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://authuser:authpass@localhost:5432/authdb
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 15m

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate --config prisma7.config.ts

      - run: pnpm run lint

      - run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - run: pnpm exec prisma migrate deploy --config prisma7.config.ts

      - run: pnpm run test:cov

      - run: pnpm run test:e2e

      - run: pnpm run build
